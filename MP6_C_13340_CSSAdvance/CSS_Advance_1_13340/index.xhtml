<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" type="text/css" href="style.css" />
    <title>Formulir Evaluasi Seminar FTI</title>
</head>
<body>
    <h1>Formulir Evaluasi Seminar FTI</h1>
    <form action="" method="post" enctype="multipart/form-data">
        <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse; width: 100%;">
            <tr>
                <td>
                    <label for="nama"><strong>Nama Peserta</strong></label>
                </td>
                <td>
                    <input type="text" id="nama" name="nama" size="30" />
                </td>
            </tr>
            <tr>
                <td>
                    <label for="email"><strong>Email</strong></label>
                </td>
                <td>
                    <input type="text" id="email" name="email" size="30" />
                </td>
            </tr>
            <tr>
                <td>
                    <label for="npm"><strong>NPM Mahasiswa</strong></label>
                </td>
                <td>
                    <input type="text" id="npm" name="npm" size="30" />
                </td>
            </tr>
            <tr>
                <td>
                    <label for="prodi"><strong>Program Studi</strong></label>
                </td>
                <td>
                    <select id="prodi" name="prodi">
                        <option>Informatika</option>
                        <option>Sistem Informasi</option>
                        <option>Teknik Industri</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <strong>Jenis Tiket</strong>
                </td>
                <td>
                    <input type="checkbox" id="reguler" name="tiket" value="Reguler" />
                    <label for="reguler">Reguler</label>
                    <input type="checkbox" id="vip" name="tiket" value="VIP" />
                    <label for="vip">VIP</label>
                    <input type="checkbox" id="online" name="tiket" value="Online" />
                    <label for="online">Online</label>
                </td>
            </tr>
            <tr>
                <td style="vertical-align:top;">
                    <strong>Topik Seminar</strong>
                </td>
                <td>
                    <p>
                        <input type="checkbox" id="ai" name="topik" value="Artificial Intelligence" />
                        <label for="ai">Artificial Intelligence</label>
                    </p>
                    <p>
                        <input type="checkbox" id="data" name="topik" value="Data Science" />
                        <label for="data">Data Science</label>
                    </p>
                    <p>
                        <input type="checkbox" id="cyber" name="topik" value="Cyber Security" />
                        <label for="cyber">Cyber Security</label>
                    </p>
                    <p>
                        <input type="checkbox" id="cloud" name="topik" value="Cloud Computing" />
                        <label for="cloud">Cloud Computing</label>
                    </p>
                    <p>
                        <input type="checkbox" id="web" name="topik" value="Web Development" />
                        <label for="web">Web Development</label>
                    </p>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="jam"><strong>Pilihan Jam (Sesi)</strong></label>
                </td>
                <td>
                    <select id="jam" name="jam">
                        <option>Sesi 1 08.00 - 10.00</option>
                        <option>Sesi 2 10.00 - 12.00</option>
                        <option>Sesi 3 13.00 - 15.00</option>
                        <option>Sesi 4 15.00 - 17.00</option>
                        <option>Sesi 5 19.00 - 21.00</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td style="vertical-align: top;">
                    <label for="evaluasi"><strong>Evaluasi untuk Narasumber</strong></label>
                </td>
                <td>
                    <textarea id="evaluasi" name="evaluasi" rows="8" cols="30"></textarea>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="bukti"><strong>Bukti Keikutsertaan</strong></label>
                </td>
                <td>
                    <input type="file" id="bukti" name="bukti" accept="image/gif, image/jpeg, image/png" />
                </td>
            </tr>
            <tr>
                <td colspan="2" style="text-align:center;">
                    <input type="submit" name="simpan" value="Simpan" />
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
